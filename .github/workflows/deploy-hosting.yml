name: Deploy Hosting Only (macOS from artifact)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g., 4.0.0) - must match the artifact filename"
        required: true
        default: "4.0.0"

jobs:
  deploy-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Download latest macOS ZIP artifact from build workflow
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: macos-unsigned-deploy.yml
          workflow_conclusion: completed
          name: macos-unsigned-zip
          path: artifact
          branch: main

      - name: Export version variables
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MAJOR=${VERSION%%.*}" >> $GITHUB_ENV

      - name: Prepare Hosting folder structure and place ZIP
        run: |
          mkdir -p "public/macos/v${MAJOR}/"
          if [ ! -f "artifact/BrieFly-macOS-${{ inputs.version }}.zip" ]; then
            echo "Expected artifact file artifact/BrieFly-macOS-${{ inputs.version }}.zip not found."
            echo "Listing downloaded artifact directory:"
            ls -la artifact || true
            exit 1
          fi
          mv "artifact/BrieFly-macOS-${{ inputs.version }}.zip" "public/macos/v${MAJOR}/"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: epl-3-the-brief
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "FIREBASE_TOKEN missing"; exit 1; fi
          firebase --version
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"
