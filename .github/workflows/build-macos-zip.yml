name: Build macOS ZIP (artifact only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g., 4.0.0)"
        required: true
        default: "4.0.0"

jobs:
  build-zip:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS release (unsigned)
        run: |
          set -o pipefail
          flutter build macos --release -v 2>&1 | tee build_macos.log

      - name: Zip .app
        run: |
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "App not found under build/macos/Build/Products/Release/*.app"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          ZIP_NAME="BrieFly-macOS-${{ inputs.version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"

      - name: Export version variables
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MAJOR=${VERSION%%.*}" >> $GITHUB_ENV

      - name: Prepare artifact folder
        run: |
          mkdir -p "public/macos/v${MAJOR}/"
          mv "BrieFly-macOS-${{ inputs.version }}.zip" "public/macos/v${MAJOR}/"

      - name: Upload macOS ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-zip
          path: public/macos/v${{ env.MAJOR }}/BrieFly-macOS-${{ inputs.version }}.zip

      - name: Authenticate to Google Cloud (service account)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}

      - name: Set gcloud project
        run: gcloud config set project epl-3-the-brief

      - name: Upload ZIP to Firebase Storage and make public
        env:
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ env.MAJOR }}
        run: |
          echo "Uploading to gs://epl-3-the-brief.appspot.com/macos/v${MAJOR}/BrieFly-macOS-${VERSION}.zip"
          gsutil cp "public/macos/v${MAJOR}/BrieFly-macOS-${VERSION}.zip" "gs://epl-3-the-brief.appspot.com/macos/v${MAJOR}/BrieFly-macOS-${VERSION}.zip"
          # Make the object publicly readable (no token URL)
          gsutil acl ch -u AllUsers:R "gs://epl-3-the-brief.appspot.com/macos/v${MAJOR}/BrieFly-macOS-${VERSION}.zip"
          echo "Public URL (GCS): https://storage.googleapis.com/epl-3-the-brief.appspot.com/macos/v${MAJOR}/BrieFly-macOS-${VERSION}.zip"
          echo "Public URL (Firebase API): https://firebasestorage.googleapis.com/v0/b/epl-3-the-brief.appspot.com/o/macos%2Fv${MAJOR}%2FBrieFly-macOS-${VERSION}.zip?alt=media"

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@13

      - name: Deploy Hosting (publish site content)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          firebase --version
          firebase deploy --only hosting --project epl-3-the-brief --non-interactive

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_macos_log
          path: build_macos.log
