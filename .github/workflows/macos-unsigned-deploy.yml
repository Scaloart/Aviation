name: Build and Deploy macOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g., 4.0.0)"
        required: true
        default: "4.0.0"
      deploy_only:
        description: "Skip build and deploy latest artifact"
        required: false
        default: "false"

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        if: ${{ inputs.deploy_only != 'true' }}
        run: flutter pub get

      - name: Build macOS release (unsigned)
        if: ${{ inputs.deploy_only != 'true' }}
        run: |
          set -o pipefail
          flutter build macos --release -v 2>&1 | tee build_macos.log

      - name: Zip .app
        if: ${{ inputs.deploy_only != 'true' }}
        run: |
          # Find built .app in Flutter's default output dir
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "App not found under build/macos/Build/Products/Release/*.app"
            echo "Directory listing:" && ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          ZIP_NAME="BrieFly-macOS-${{ inputs.version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"

      - name: Export version variables
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MAJOR=${VERSION%%.*}" >> $GITHUB_ENV

      - name: Download latest macOS ZIP artifact (deploy only)
        if: ${{ inputs.deploy_only == 'true' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: macos-unsigned-deploy.yml
          workflow_conclusion: failure
          name: macos-unsigned-zip
          path: artifact_failed
          branch: main

      - name: Fallback: download from latest completed run (deploy only)
        if: ${{ inputs.deploy_only == 'true' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: macos-unsigned-deploy.yml
          workflow_conclusion: completed
          name: macos-unsigned-zip
          path: artifact_completed
          branch: main

      - name: Prepare ZIP from artifact (deploy only)
        if: ${{ inputs.deploy_only == 'true' }}
        run: |
          mkdir -p "public/macos/v${MAJOR}/"
          # Prefer artifact from latest failed run (where build succeeded but deploy failed), else use completed
          ART_FAILED="artifact_failed/BrieFly-macOS-${{ inputs.version }}.zip"
          ART_COMPLETED="artifact_completed/BrieFly-macOS-${{ inputs.version }}.zip"
          if [ -f "$ART_FAILED" ]; then
            mv "$ART_FAILED" "public/macos/v${MAJOR}/"
          elif [ -f "$ART_COMPLETED" ]; then
            mv "$ART_COMPLETED" "public/macos/v${MAJOR}/"
          else
            echo "No macOS ZIP artifact found in latest failed or completed runs."
            echo "Listing artifact_failed:" && ls -la artifact_failed || true
            echo "Listing artifact_completed:" && ls -la artifact_completed || true
            exit 1
          fi

      - name: Prepare Hosting folder structure
        if: ${{ inputs.deploy_only != 'true' }}
        run: |
          mkdir -p "public/macos/v${MAJOR}/"
          mv "BrieFly-macOS-${{ inputs.version }}.zip" "public/macos/v${MAJOR}/"

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@13

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-zip
          path: public/macos/v${{ env.MAJOR }}/BrieFly-macOS-${{ inputs.version }}.zip

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: epl-3-the-brief
          FIREBASE_SITE: epl-3-the-brief
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "FIREBASE_TOKEN secret is missing"; exit 1; fi
          firebase --version
          # Create a local hosting target mapping for this run and deploy to it
          firebase target:apply hosting default "$FIREBASE_SITE" --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"
          firebase deploy --only hosting:default --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_macos_log
          path: build_macos.log

# touch: ensure workflow_dispatch present on remote
